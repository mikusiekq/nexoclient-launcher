# Every push to main publishes a new launcher release: builds the Windows installer and creates the
# GitHub Release v1.0.<run number>. Installed launchers see it on their next start and update themselves.
# Add [skip ci] to a commit message to push without releasing. "Run workflow" in the Actions tab rebuilds manually.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Version grows with every run, so each release counts as an update
      - name: Set version
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build and publish installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
